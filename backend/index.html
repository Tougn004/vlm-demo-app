<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VLM Person Alert</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --ok: #22c55e;
        --warn: #f59e0b;
        --bad: #ef4444;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, #1e293b 0%, var(--bg) 55%);
        color: var(--text);
      }
      .wrap {
        max-width: 800px;
        margin: 32px auto;
        padding: 0 16px;
      }
      .card {
        background: rgba(17, 24, 39, 0.85);
        border: 1px solid #334155;
        border-radius: 14px;
        padding: 16px;
      }
      .top-grid {
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        gap: 14px;
        margin-top: 12px;
      }
      .muted { color: var(--muted); }
      .event { border-top: 1px solid #334155; padding: 10px 0; }
      .alert-event {
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 10px;
        border: 1px solid transparent;
        font-weight: 600;
      }
      .alert-event.alert {
        background: rgba(239, 68, 68, 0.2);
        border-color: rgba(239, 68, 68, 0.55);
        color: #fecaca;
      }
      .alert-event.error {
        background: rgba(245, 158, 11, 0.22);
        border-color: rgba(245, 158, 11, 0.6);
        color: #fde68a;
      }
      .last-vlm-box {
        border-radius: 10px;
        padding: 10px 12px;
        margin: 10px 0 12px 0;
        border: 1px solid rgba(14, 165, 233, 0.55);
        background: rgba(14, 165, 233, 0.18);
        color: #bae6fd;
        font-weight: 600;
        display: block;
      }
      .camera {
        width: 100%;
        border-radius: 10px;
        border: 1px solid #334155;        
        background: #020617;
      }
      button {
        background: #0ea5e9;
        color: #001018;
        border: none;
        border-radius: 10px;
        padding: 10px 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .pill { padding: 2px 8px; border-radius: 999px; font-size: 12px; }
      .pill.ok { background: rgba(34,197,94,0.2); color: #86efac; }
      .pill.bad { background: rgba(239,68,68,0.2); color: #fca5a5; }
      textarea {
        width: 100%;
        min-height: 110px;
        background: #020617;
        color: var(--text);
        border: 1px solid #334155;
        border-radius: 10px;
        padding: 10px;
        font-family: Consolas, Monaco, monospace;
      }
      .prompt-row {
        margin-top: 8px;
      }
      @media (max-width: 860px) {
        .top-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>VLM Person Alert</h1>
      <p class="muted">Reads USB webcam frames, queries local Ollama vision model, and triggers browser alerts when a person is detected.</p>

      <div class="card">
        <p>Status: <span id="status-pill" class="pill">starting...</span></p>
        <button id="notif-btn">Enable Browser Notifications</button>
        <div id="last-vlm-box" class="last-vlm-box">Last VLM Message: Waiting for first detection...</div>
        <div class="top-grid">
          <div>
            <img class="camera" id="camera-feed" src="/camera" alt="Live webcam feed" />
          </div>
          <div>
            <p class="muted">System prompt used on every poll:</p>
            <textarea id="prompt-box"></textarea>
            <p class="prompt-row">
              <button id="save-prompt-btn">Save Prompt</button>
              <span id="prompt-save-status" class="muted"></span>
            </p>
          </div>
        </div>
      </div>

      <h2>Alerts</h2>
      <div class="card" id="alerts"></div>

      <h2>Events</h2>
      <div class="card" id="events"></div>
    </div>

    <script>
      const eventsDiv = document.getElementById('events');
      const alertsDiv = document.getElementById('alerts');
      const statusPill = document.getElementById('status-pill');
      const lastVlmBox = document.getElementById('last-vlm-box');
      const notifBtn = document.getElementById('notif-btn');
      const promptBox = document.getElementById('prompt-box');
      const savePromptBtn = document.getElementById('save-prompt-btn');
      const promptSaveStatus = document.getElementById('prompt-save-status');

      notifBtn.onclick = async () => {
        const permission = await Notification.requestPermission();
        alert('Notification permission: ' + permission);
      };

      function addEvent(text) {
        const div = document.createElement('div');
        div.className = 'event';
        div.textContent = text;
        eventsDiv.prepend(div);
      }

      function addAlert(text, level) {
        const div = document.createElement('div');
        div.className = 'alert-event ' + level;
        div.textContent = text;
        alertsDiv.prepend(div);
      }

      function updateStatus(healthy) {
        statusPill.textContent = healthy ? 'running' : 'error';
        statusPill.className = 'pill ' + (healthy ? 'ok' : 'bad');
      }

      function setLastVlmMessage(message) {
        const text = message && message.trim().length
          ? message
          : 'Waiting for first detection...';
        lastVlmBox.textContent = `Last VLM Message: ${text}`;
      }

      fetch('/status').then(r => r.json()).then(s => {
        if (s.error) {
          updateStatus(false);
        } else {
          updateStatus(true);
        }
      });
      fetch('/config/prompt')
        .then(r => r.json())
        .then(cfg => { promptBox.value = cfg.system_prompt || ''; })
        .catch(() => { promptSaveStatus.textContent = 'Failed to load current prompt'; });

      savePromptBtn.onclick = async () => {
        promptSaveStatus.textContent = 'Saving...';
        const response = await fetch('/config/prompt', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ system_prompt: promptBox.value })
        });
        const body = await response.json();
        if (!response.ok || !body.ok) {
          promptSaveStatus.textContent = body.error || 'Failed to save prompt';
          return;
        }
        promptSaveStatus.textContent = 'Saved. Will be used on next poll.';
      };

      const source = new EventSource('/events');

      source.addEventListener('detection', (evt) => {
        const e = JSON.parse(evt.data);
        const p = e.payload;
        const summary = p.summary || '';
        const countText = (p.count !== undefined && p.count !== null) ? ` count=${p.count}` : '';
        const txt = `[${e.ts}] Detection: person_detected=${p.person_detected} confidence=${p.confidence}${countText} summary=${summary}`;
        addEvent(txt);
        updateStatus(true);
        setLastVlmMessage(p.raw_response || summary || txt);
      });

      source.addEventListener('alert', (evt) => {
        const e = JSON.parse(evt.data);
        const p = e.payload;
        const txt = `[${e.ts}] ALERT: Person detected (confidence ${p.confidence})`;
        addEvent(txt);
        addAlert(txt, 'alert');
        if (Notification.permission === 'granted') {
          new Notification('VLM Alert', { body: txt });
        }
      });

      source.addEventListener('error', (evt) => {
        const e = JSON.parse(evt.data);
        const txt = `[${e.ts}] ERROR: ${e.payload.message}`;
        addEvent(txt);
        addAlert(txt, 'error');
        updateStatus(false);
      });
    </script>
  </body>
</html>
